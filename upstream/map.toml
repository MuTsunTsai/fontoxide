# Maps fontTools source paths to the fontoxide crates that port them.
# `cargo xtask upstream-report` groups upstream changes with these entries (longest
# prefix wins). `synced` is the fontTools tag a part was last brought in line with;
# leave it out until the part is ported, and update it after each sync.

[[map]]
upstream = "Lib/fontTools/afmLib/"
rust = ["fontoxide-afmlib"]

