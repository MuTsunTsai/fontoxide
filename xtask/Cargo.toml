[package]
name = "xtask"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
# All the extras: parity compares against fonttools[all].
fontoxide-ttlib = { workspace = true, optional = true, features = ["woff", "graphite", "pathops", "repacker"] }
fontoxide-subset = { workspace = true, optional = true }
fontoxide-varlib = { workspace = true, optional = true }
brotli = { workspace = true, optional = true }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"

[features]
default = ["parity"]
# The parity command links fontoxide itself; codegen must not, so that it can run
# while the generated code does not compile yet (`cargo codegen`).
parity = ["dep:fontoxide-ttlib", "dep:fontoxide-subset", "dep:fontoxide-varlib", "dep:brotli"]

[lints]
workspace = true
