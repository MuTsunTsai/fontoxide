[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
# Only the latest stable Rust is supported while the project is pre-1.0.
rust-version = "1.99"
license = "MIT"
authors = ["Mu-Tsun Tsai"]
repository = "https://github.com/MuTsunTsai/fontoxide"
homepage = "https://github.com/MuTsunTsai/fontoxide"
keywords = ["font", "opentype", "truetype", "fonttools", "woff2"]
categories = ["parser-implementations", "encoding", "text-processing"]

[workspace.dependencies]
kurbo = "0.13"
linesweeper = "0.5"
fontoxide-cli = { path = "crates/fontoxide-cli", version = "0.0.0" }
fontoxide-colorlib = { path = "crates/fontoxide-colorlib", version = "0.0.0" }
fontoxide-cu2qu = { path = "crates/fontoxide-cu2qu", version = "0.0.0" }
fontoxide-qu2cu = { path = "crates/fontoxide-qu2cu", version = "0.0.0" }
fontoxide-designspacelib = { path = "crates/fontoxide-designspacelib", version = "0.0.0" }
fontoxide-encodings = { path = "crates/fontoxide-encodings", version = "0.0.0" }
fontoxide-fealib = { path = "crates/fontoxide-fealib", version = "0.0.0" }
fontoxide-merge = { path = "crates/fontoxide-merge", version = "0.0.0" }
fontoxide-misc = { path = "crates/fontoxide-misc", version = "0.0.0" }
fontoxide-mtilib = { path = "crates/fontoxide-mtilib", version = "0.0.0" }
fontoxide-otllib = { path = "crates/fontoxide-otllib", version = "0.0.0" }
fontoxide-pens = { path = "crates/fontoxide-pens", version = "0.0.0" }
fontoxide-repack = { path = "crates/fontoxide-repack", version = "0.0.0" }
fontoxide-subset = { path = "crates/fontoxide-subset", version = "0.0.0" }
fontoxide-svglib = { path = "crates/fontoxide-svglib", version = "0.0.0" }
fontoxide-t1lib = { path = "crates/fontoxide-t1lib", version = "0.0.0" }
# Without the extras (see its features): each crate enables the ones it needs, and
# the umbrella crate `fontoxide` all of them by default.
fontoxide-ttlib = { path = "crates/fontoxide-ttlib", version = "0.0.0", default-features = false }
fontoxide-ufolib = { path = "crates/fontoxide-ufolib", version = "0.0.0" }
fontoxide-unicodedata = { path = "crates/fontoxide-unicodedata", version = "0.0.0" }
fontoxide-varlib = { path = "crates/fontoxide-varlib", version = "0.0.0" }
fontoxide-voltlib = { path = "crates/fontoxide-voltlib", version = "0.0.0" }
brotli = { version = "9.1.1", default-features = false, features = ["std"] }
flate2 = "1.1.11"
indexmap = "2.7"
log = "0.4.35"
# Graphite table compression (fontTools' `lz4.block`); block format only, safe code.
# WOFF 1.0 with `--with-zopfli` (fontTools' `zopfli` module); pure Rust. Its output
# differs slightly from the C zopfli that fontTools uses: only the decompressed
# data is compared.
zopfli = { version = "0.8", default-features = false, features = ["std", "zlib"] }
lz4_flex = { version = "0.11", default-features = false, features = ["safe-encode", "safe-decode", "checked-decode"] }
roxmltree = "0.21.2"
thiserror = "2.0.21"
# Zipped UFOs: the container only, without dependencies; deflate is done with flate2,
# whose backend is the pure-Rust default (miniz_oxide), so that it builds for
# wasm32-unknown-unknown.
rawzip = "0.5.2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

# Line tables only: backtraces keep file names and line numbers, but the PDBs and
# incremental caches of the large generated code stay several times smaller.
[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
