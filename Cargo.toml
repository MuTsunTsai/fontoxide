[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
# Only the latest stable Rust is supported while the project is pre-1.0.
rust-version = "1.99"
license = "MIT"
authors = ["Mu-Tsun Tsai"]
repository = "https://github.com/MuTsunTsai/fontoxide"
homepage = "https://github.com/MuTsunTsai/fontoxide"
keywords = ["font", "opentype", "truetype", "fonttools", "woff2"]
categories = ["parser-implementations", "encoding", "text-processing"]

[workspace.dependencies]
kurbo = "0.13"
linesweeper = "0.5"
fontoxide-agl = { path = "crates/fontoxide-agl", version = "0.0.0" }
fontoxide-cu2qu = { path = "crates/fontoxide-cu2qu", version = "0.0.0" }
fontoxide-qu2cu = { path = "crates/fontoxide-qu2cu", version = "0.0.0" }
fontoxide-encodings = { path = "crates/fontoxide-encodings", version = "0.0.0" }
fontoxide-misc = { path = "crates/fontoxide-misc", version = "0.0.0" }
fontoxide-pens = { path = "crates/fontoxide-pens", version = "0.0.0" }
fontoxide-repack = { path = "crates/fontoxide-repack", version = "0.0.0" }
fontoxide-subset = { path = "crates/fontoxide-subset", version = "0.0.0" }
fontoxide-ttlib = { path = "crates/fontoxide-ttlib", version = "0.0.0" }
fontoxide-unicodedata = { path = "crates/fontoxide-unicodedata", version = "0.0.0" }
fontoxide-varlib = { path = "crates/fontoxide-varlib", version = "0.0.0" }
brotli = { version = "9.1.1", default-features = false, features = ["std"] }
flate2 = "1.1.11"
log = "0.4.35"
roxmltree = "0.21.2"
thiserror = "2.0.21"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
