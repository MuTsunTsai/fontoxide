[package]
name = "fontoxide-subset"
description = "Font subsetting; a port of fontTools.subset"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
# The tests need the fontTools submodule and its test data.
exclude = ["tests/"]

[dependencies]
fontoxide-colorlib.workspace = true
fontoxide-misc.workspace = true
fontoxide-otllib.workspace = true
fontoxide-ttlib.workspace = true
fontoxide-unicodedata.workspace = true
log.workspace = true
thiserror.workspace = true

[dev-dependencies]
# The tests compare with fontTools installed with all its extras.
fontoxide-ttlib = { path = "../fontoxide-ttlib", default-features = false, features = ["woff", "graphite", "pathops", "repacker"] }
fontoxide-pens = { path = "../fontoxide-pens" }

[lints]
workspace = true
