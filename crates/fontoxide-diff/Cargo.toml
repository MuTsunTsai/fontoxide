[package]
name = "fontoxide-diff"
description = "Comparing fonts table by table; a port of fontTools.diff"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
# The tests need the fontTools submodule and its test data.
exclude = ["tests/"]

[dependencies]
fontoxide-misc.workspace = true
# Reading WOFF and WOFF 2.0 fonts, and dumping compressed Graphite tables, as
# fontTools installed with its extras does.
fontoxide-ttlib = { workspace = true, features = ["woff", "graphite"] }
jiff.workspace = true
thiserror.workspace = true

[dev-dependencies]
# The tests compare with fontTools installed with all its extras.
fontoxide-ttlib = { path = "../fontoxide-ttlib", default-features = false, features = ["woff", "graphite", "pathops", "repacker"] }

[lints]
workspace = true
