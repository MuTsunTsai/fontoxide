[package]
name = "fontoxide-cli"
description = "The fontoxide executable, which runs the fontTools command lines (ttx, subset, merge, varLib.instancer, ...); a port of fontTools.ttx and fontTools.__main__"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["woff", "graphite", "pathops", "repacker"]
# fontTools' extras; see the features of `fontoxide-ttlib`.
woff = ["fontoxide-ttlib/woff"]
graphite = ["fontoxide-ttlib/graphite"]
pathops = ["fontoxide-ttlib/pathops"]
repacker = ["fontoxide-ttlib/repacker"]
# Also installs fontTools' console scripts `fonttools`, `ttx`, `pyftsubset` and
# `pyftmerge`, with fontTools' usage and help texts.
fonttools-names = []

[[bin]]
name = "fontoxide"
path = "src/bin/fontoxide.rs"

[[bin]]
name = "fonttools"
path = "src/bin/fonttools.rs"
required-features = ["fonttools-names"]

[[bin]]
name = "ttx"
path = "src/bin/ttx.rs"
required-features = ["fonttools-names"]

[[bin]]
name = "pyftsubset"
path = "src/bin/pyftsubset.rs"
required-features = ["fonttools-names"]

[[bin]]
name = "pyftmerge"
path = "src/bin/pyftmerge.rs"
required-features = ["fonttools-names"]

[dependencies]
fontoxide-cu2qu.workspace = true
fontoxide-fealib.workspace = true
fontoxide-merge.workspace = true
fontoxide-misc.workspace = true
fontoxide-mtilib.workspace = true
fontoxide-otllib.workspace = true
fontoxide-pens.workspace = true
fontoxide-qu2cu.workspace = true
fontoxide-subset.workspace = true
fontoxide-ttlib.workspace = true
fontoxide-varlib.workspace = true
fontoxide-voltlib.workspace = true
log.workspace = true
thiserror.workspace = true

[dev-dependencies]
# FontBuilder, to build the font of a test as fontTools does.
fontoxide = { path = "../fontoxide" }

[lints]
workspace = true
