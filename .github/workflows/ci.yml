name: CI

# Changes that only touch documentation or editor settings do not run CI. No
# test reads these files (the crates do not include their READMEs as docs).
on:
  push:
    branches: [main]
    paths-ignore: &docs-only
      - "**.md"
      - "**/LICENSE*"
      - ".vscode/**"
      - ".gitignore"
  pull_request:
    paths-ignore: *docs-only

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The tests read the data of fontTools' `Tests`.
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      - name: Build for wasm32
        run: cargo build --package fontoxide --target wasm32-unknown-unknown

  features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Each feature of the umbrella crate (a subpackage or one of fontTools'
      # extras) builds on its own, natively and for wasm32.
      - name: Features one at a time
        run: |
          features=$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "fontoxide") | .features | keys[] | select(. != "default")')
          for target in x86_64-unknown-linux-gnu wasm32-unknown-unknown; do
            cargo check -p fontoxide-ttlib --no-default-features --target $target
            cargo check -p fontoxide --no-default-features --target $target
            for feature in $features; do
              cargo check -p fontoxide --no-default-features --features $feature --target $target
            done
          done
      # Without the extras, fontoxide fails as fontTools does without the packages.
      - run: cargo test -p fontoxide-ttlib --no-default-features

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      # The tests only: the parity runs need the local font corpus.
      - run: cargo xtask coverage --no-parity --html
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: target/llvm-cov-target/report

  upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v7
      - uses: Swatinem/rust-cache@v2
      - name: Test manifest is in sync with upstream
        run: cargo xtask test-manifest --check
      # Negative controls: the parity harness must report the failures it is meant
      # to catch, rather than pass them off as matches.
      - name: Parity harness self-test
        run: cargo xtask parity --self-test

  fuzz:
    runs-on: ubuntu-latest
    # A short random run: a new finding is reported, but does not fail the
    # workflow. The regression inputs run in `cargo test` (fuzz_regressions).
    continue-on-error: true
    env:
      # Nightly may warn about lints that stable does not have yet.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      # Keeps the targets compiling and catches shallow regressions: each target
      # runs for a minute from the committed seeds (see fuzz/README.md). No
      # sanitizer: the code is safe Rust. The target must be explicit, as the
      # prebuilt cargo-fuzz defaults to its own (musl) target.
      - name: Run each fuzz target for 60 s
        working-directory: fuzz
        run: |
          cargo fuzz build -O -s none --target x86_64-unknown-linux-gnu
          for target in $(cargo fuzz list); do
            case $target in
              font_read | woff2 | subset | ttx_import) max_len=65536 ;;
              *) max_len=16384 ;;
            esac
            cargo fuzz run -O -s none --target x86_64-unknown-linux-gnu $target -- -max_total_time=60 -max_len=$max_len \
              -rss_limit_mb=2048 -timeout=10
          done
