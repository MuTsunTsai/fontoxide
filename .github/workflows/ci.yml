name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The tests read the data of fontTools' `Tests`.
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      - name: Build for wasm32
        run: cargo build --package fontoxide --target wasm32-unknown-unknown

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      # The tests only: the parity runs need the local font corpus.
      - run: cargo xtask coverage --no-parity --html
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: target/llvm-cov-target/report

  upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v7
      - uses: Swatinem/rust-cache@v2
      - name: Test manifest is in sync with upstream
        run: cargo xtask test-manifest --check
      # Negative controls: the parity harness must report the failures it is meant
      # to catch, rather than pass them off as matches.
      - name: Parity harness self-test
        run: cargo xtask parity --self-test
